<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="title desc">
  <title id="title">研究与模拟流程</title>
  <desc id="desc">行情和事件经过校验、语义与策略研究、执行资格检查、模拟撮合与账本核对；工作台只读呈现研究与账户状态。</desc>
  <rect width="960" height="280" fill="#ffffff" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <text x="24" y="33" font-family="sans-serif" font-size="21" font-weight="600" fill="#172033">研究与模拟流程</text>
  <rect x="22" y="65" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="90.0" y="104.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">行情与事件</text>
  <polyline points="158,99 178,99" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="178" y="65" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="246.0" y="104.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">数据校验</text>
  <polyline points="314,99 334,99" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="334" y="65" width="136" height="68" rx="8" fill="#eff6ff" stroke="#93b4dd" stroke-width="1.2" />
  <text x="402.0" y="93.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">语义、规则</text>
  <text x="402.0" y="114.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">与模型研究</text>
  <polyline points="470,99 490,99" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="490" y="65" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="558.0" y="93.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">执行资格</text>
  <text x="558.0" y="114.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">与风险约束</text>
  <polyline points="626,99 646,99" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="646" y="65" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="714.0" y="104.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">模拟撮合</text>
  <polyline points="782,99 802,99" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="802" y="65" width="136" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="870.0" y="93.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">账本、对账</text>
  <text x="870.0" y="114.5" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">与复盘</text>
  <rect x="412" y="190" width="180" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="502.0" y="223.0" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e293b">只读工作台</text>
  <polyline points="402,133 402,218 412,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="870,133 870,218 592,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="24" y="266" font-family="sans-serif" font-size="13" fill="#64748b">观点、信号、执行资格、订单与成交分别记录。</text>
</svg>
